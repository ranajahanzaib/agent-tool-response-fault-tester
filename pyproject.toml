[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-tool-response-fault-tester"
version = "0.1.0"
description = "Discover which tool responses make AI agents fail."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115", "httpx>=0.27", "pydantic>=2.8", "pyyaml>=6", "rich>=13", "typer>=0.12", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
agent-tool-response-fault-tester = "agent_tool_response_fault_tester.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tool_response_fault_tester"]
include = ["src/agent_tool_response_fault_tester/examples/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: opt-in tests that contact a locally running Ollama instance"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "E701", "E702"]
