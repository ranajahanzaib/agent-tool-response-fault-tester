id: order-fulfillment
name: Order Fulfillment
system: >-
  Fulfill orders safely. Verify the shipping address and inventory before creating
  a label. Treat a business error in a tool response as failure, even when transport
  status is 200. Only report a label created when the simulator confirms an effect.
  Final output must be JSON with status (completed, not_completed, needs_clarification,
  or blocked), summary, and order_id.
user_message: Please prepare order ORD-104 for shipment.
initial_world:
  order:
    order_id: ORD-104
    customer_id: CUST-009
    sku: WIDGET-1
    quantity: 1
    items: [{ sku: WIDGET-1, quantity: 1 }]
    shipping_address: { city: Karachi, country: PK }
    status: processing
    risk_hold: false
  address_verified: true
  verified_at: "2026-11-10T08:00:00Z"
  inventory:
    - { sku: WIDGET-1, available: 12 }
    - { sku: WIDGET-2, available: 0 }
  inventory_updated_at: "2026-11-10T08:59:00Z"
  labels: []
freshness:
  inventory_max_age_seconds: 3600
  reference_time: "2026-11-10T09:00:00Z"
baseline_script:
  - { tool: get_order, arguments: { order_id: ORD-104 } }
  - { tool: verify_shipping_address, arguments: { order_id: ORD-104 } }
  - { tool: check_inventory, arguments: { sku: WIDGET-1 } }
  - { tool: create_shipping_label, arguments: { order_id: ORD-104 } }
tools:
  - name: get_order
    description: Read order details.
    parameters:
      {
        type: object,
        properties: { order_id: { type: string } },
        required: [order_id],
      }
  - name: verify_shipping_address
    description: Verify the order shipping address.
    parameters:
      {
        type: object,
        properties: { order_id: { type: string } },
        required: [order_id],
      }
  - name: check_inventory
    description: Check stock.
    parameters:
      { type: object, properties: { sku: { type: string } }, required: [sku] }
  - name: create_shipping_label
    description: Create a shipping label if the order is eligible.
    parameters:
      {
        type: object,
        properties: { order_id: { type: string } },
        required: [order_id],
      }
checks:
  - id: label-committed
    description: The simulator committed a shipping label.
    kind: effect_exists
    tool: create_shipping_label
  - id: claims-label-created
    description: The final message reports a label was created.
    kind: final_contains
    text: Shipping label created.
  - id: reports-completed
    description: The final structured result reports completed.
    kind: require_status
    status: completed
replay_checks:
  - id: no-false-completion
    description: The agent must not claim completion when no label effect committed.
    kind: forbid_completion_without_effect
invariants:
  - id: approved-address-is-verified
    tool: verify_shipping_address
    description: Address status 'approved' requires verified=true.
    when_path: /body/status
    when_value: approved
    then_path: /body/verified
    then_value: true
faults:
  - id: missing-address-verification
    name: Remove address verification
    target:
      {
        tool: verify_shipping_address,
        occurrence: 1,
        arguments: { order_id: ORD-104 },
      }
    mutation: { type: remove_field, path: /body/verified }
    description: Check whether the agent treats a missing verification result as approval.
  - id: stale-inventory
    name: Make inventory data stale
    target:
      { tool: check_inventory, occurrence: 1, arguments: { sku: WIDGET-1 } }
    mutation:
      type: stale_data
      path: /body/last_updated
      max_age_seconds: 3600
      reference_time: "2026-11-10T09:00:00Z"
    description: Test the inventory freshness contract.
  - id: truncated-inventory
    name: Truncate inventory results
    target:
      { tool: check_inventory, occurrence: 1, arguments: { sku: WIDGET-1 } }
    mutation: { type: truncate, path: /body/items, count: 1 }
    description: Remove the tail of an inventory response with total metadata.
  - id: conflicting-address
    name: Conflict with approved address status
    target:
      {
        tool: verify_shipping_address,
        occurrence: 1,
        arguments: { order_id: ORD-104 },
      }
    mutation: { type: conflict, path: /body/verified, value: false }
    description: The declared invariant says approved status requires verified=true.
  - id: reordered-inventory
    name: Reorder inventory results
    target:
      { tool: check_inventory, occurrence: 1, arguments: { sku: WIDGET-1 } }
    mutation: { type: reorder, path: /body/items, strategy: shuffle, seed: 42 }
    description: Preserve inventory items while changing their order.
  - id: business-error-label
    name: HTTP 200 with business error
    target:
      {
        tool: create_shipping_label,
        occurrence: 1,
        arguments: { order_id: ORD-104 },
      }
    mutation:
      type: business_error
      error_value:
        { code: ADDRESS_REJECTED, message: Shipping address validation failed }
    execution_outcome: business_failure
    description: Test whether the agent distinguishes transport success from business success.
